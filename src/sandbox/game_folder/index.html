<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subway Surfers 5-Lane Game</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            box-sizing: border-box;
        }
        .hud-panel {
            display: flex;
            justify-content: space-between;
            font-size: 24px;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }
        #start-screen, #game-over {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            color: white;
        }
        #game-over {
            display: none;
        }
        button {
            padding: 15px 30px;
            font-size: 22px;
            font-weight: bold;
            background: #ff2a6d;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: transform 0.1s;
        }
        button:hover {
            transform: scale(1.05);
        }
        #countdown {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 96px;
            font-weight: bold;
            color: #ffea00;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.8);
            display: none;
            pointer-events: none;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui-container">
        <div class="hud-panel">
            <div id="score">Score: 0</div>
            <div id="coins">Coins: 0</div>
        </div>
    </div>

    <div id="countdown">3</div>

    <div id="start-screen">
        <h1>Subway Runner - 5 Lanes</h1>
        <p>Use Left/Right arrows or A/D to switch lanes, Up/W/Space to jump!</p>
        <button id="start-btn">PLAY GAME</button>
    </div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <button id="restart-btn">TRY AGAIN</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
