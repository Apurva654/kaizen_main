<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subway Surfers 3D - Advanced Edition</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="hud">
        <div id="score-board">SCORE: <span id="score">0</span></div>
        <div id="coins-board">COINS: <span id="coins">0</span></div>
        <div id="powerup-status" class="hidden">POWER-UP: <span id="powerup-name">NONE</span> (<span id="powerup-timer">0</span>s)</div>
    </div>
    
    <div id="instructions">
        <h1>SUBWAY SURFERS 3D</h1>
        <div class="subtitle">ADVANCED EDITION</div>
        <p><b>LEFT / RIGHT</b> or <b>A / D</b>: Switch Lanes</p>
        <p><b>UP</b> or <b>W / SPACE</b>: Jump over barriers</p>
        <p><b>DOWN</b> or <b>S</b>: Duck under high bars</p>
        <button id="start-btn">START RUN</button>
    </div>

    <div id="countdown" class="hidden">3</div>

    <div id="game-over" class="hidden">
        <h2>WIPE OUT!</h2>
        <p>Final Score: <span id="final-score">0</span></p>
        <p>Coins Collected: <span id="final-coins">0</span></p>
        <button id="restart-btn">RUN AGAIN</button>
    </div>

    <script src="audio.js"></script>
    <script src="game.js"></script>
</body>
</html>
