<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Photorealistic 3D Earth</title><style>body { margin: 0; overflow: hidden; background-color: #000000; font-family: sans-serif; } canvas { display: block; width: 100vw; height: 100vh; }</style></head><body><script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script><script>let scene, camera, renderer, controls; let earthMesh, cloudMesh; const textureLoader = new THREE.TextureLoader(); init(); animate(); function init() { scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000); camera.position.set(0, 0, 7); renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0; document.body.appendChild(renderer.domElement); controls = new THREE.OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.05; controls.minDistance = 3.0; controls.maxDistance = 15.0; controls.autoRotate = true; controls.autoRotateSpeed = 0.5; const ambientLight = new THREE.AmbientLight(0x333333, 0.25); scene.add(ambientLight); const sunLight = new THREE.DirectionalLight(0xffffff, 1.2); sunLight.position.set(5, 3, 5); scene.add(sunLight); const earthGeometry = new THREE.SphereGeometry(2, 64, 64); const earthMaterial = new THREE.MeshPhongMaterial({ map: textureLoader.load('https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg'), bumpMap: textureLoader.load('https://threejs.org/examples/textures/planets/earth_normal_2048.jpg'), bumpScale: 0.05, specularMap: textureLoader.load('https://threejs.org/examples/textures/planets/earth_specular_2048.jpg'), specular: new THREE.Color('grey'), shininess: 25 }); earthMesh = new THREE.Mesh(earthGeometry, earthMaterial); scene.add(earthMesh); const cloudGeometry = new THREE.SphereGeometry(2.03, 64, 64); const cloudMaterial = new THREE.MeshStandardMaterial({ map: textureLoader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png'), transparent: true, opacity: 0.8, blending: THREE.AdditiveBlending, depthWrite: false }); cloudMesh = new THREE.Mesh(cloudGeometry, cloudMaterial); scene.add(cloudMesh); const atmosphereVertexShader = `varying vec3 vNormal; void main() { vNormal = normalize(normalMatrix * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`; const atmosphereFragmentShader = `varying vec3 vNormal; void main() { float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 2.0); gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity; }`; const atmosphereGeometry = new THREE.SphereGeometry(2.1, 64, 64); const atmosphereMaterial = new THREE.ShaderMaterial({ vertexShader: atmosphereVertexShader, fragmentShader: atmosphereFragmentShader, blending: THREE.AdditiveBlending, side: THREE.BackSide, transparent: true }); const atmosphereMesh = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial); scene.add(atmosphereMesh); const starGeometry = new THREE.BufferGeometry(); const starCount = 2000; const starPositions = new Float32Array(starCount * 3); for (let i = 0; i < starCount * 3; i += 3) { starPositions[i] = (Math.random() - 0.5) * 400; starPositions[i + 1] = (Math.random() - 0.5) * 400; starPositions[i + 2] = (Math.random() - 0.5) * 400; } starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3)); const starMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.7, transparent: true, opacity: 0.8 }); const starField = new THREE.Points(starGeometry, starMaterial); scene.add(starField); window.addEventListener('resize', onWindowResize); } function onWindowResize() { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); } function animate() { requestAnimationFrame(animate); earthMesh.rotation.y += 0.0005; cloudMesh.rotation.y += 0.0007; controls.update(); renderer.render(scene, camera); }</script></body></html>
